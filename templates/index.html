<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Project Euler in Rust</title>
        <link rel="stylesheet" href="../static/style.css" />
    </head>
    <body>
        <div class="container">
            <div class="eyebrow">Solutions</div>

            <h1>Project Euler</h1>

            <p class="hero-description">
                A minimal collection of Project Euler solutions implemented in
                Rust. Reference:
                <a
                    href="https://projecteuler.net"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    projecteuler.net
                </a>
            </p>

            <div class="stat-card">
                <span class="stat-number">{{COUNT}}</span>
                <span class="stat-label">solved</span>
            </div>

            <div class="section-title">Problems</div>

            <div class="problem-grid">{{LIST}}</div>
        </div>
    </body>
</html>
