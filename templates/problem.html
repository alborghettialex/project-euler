<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Problem {{NUMBER}}</title>
        <link rel="stylesheet" href="../static/style.css" />

        <link
            href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-rust.min.js"></script>
    </head>
    <body>
        <div class="container">
            <a class="back" href="index.html">← Back</a>

            <div class="eyebrow">Problem {{NUMBER}}</div>

            <h1>{{TITLE}}</h1>

            <div class="answer">Answer: {{ANSWER}}</div>

            <div class="description" >{{DESCRIPTION}}</div>

            <div class="section-title">Solution</div>

            <div class="code-shell">
                <div class="code-bar">
                    <span>Rust</span>
                    <button class="copy-btn" onclick="copyCode(this)">
                        Copy
                    </button>
                </div>

                <pre><code class="language-rust">{{CODE}}</code></pre>
            </div>
        </div>

        <script>
            function copyCode(btn) {
                const code = btn
                    .closest(".code-shell")
                    .querySelector("code").innerText;
                navigator.clipboard.writeText(code);
                btn.textContent = "Copied";
                setTimeout(() => (btn.textContent = "Copy"), 1200);
            }
        </script>
    </body>
</html>
